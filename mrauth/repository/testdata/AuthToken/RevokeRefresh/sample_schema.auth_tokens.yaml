---
- auth_token: refresh-active
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() + interval '1 hour'
- auth_token: access-active
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() + interval '1 hour'

# отозван, но окно повторного запроса ещё открыто
- auth_token: refresh-grace
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 2
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 2 # REVOKED
  expires_at: RAW=NOW() + interval '1 minute'

# истёк, не будучи отозванным
- auth_token: refresh-expired
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 3
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '1 minute'

# отозван, и окно повторного запроса закрыто
- auth_token: refresh-revoked-expired
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 4
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 2 # REVOKED
  expires_at: RAW=NOW() - interval '1 minute'
