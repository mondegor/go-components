---
# сессия 1: два действующих access токена и отозванный, выпущенный позже всех
- auth_token: access-old
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  created_at: RAW=NOW() - interval '2 hours'
  expires_at: '2099-01-01 00:00:00+00'
- auth_token: access-new
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  created_at: RAW=NOW() - interval '1 hour'
  expires_at: '2099-01-02 00:00:00+00'
- auth_token: access-revoked
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 2 # REVOKED
  created_at: RAW=NOW()
  expires_at: '2099-01-03 00:00:00+00'
- auth_token: refresh-a-1
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  created_at: RAW=NOW() - interval '2 hours'
  expires_at: '2099-02-01 00:00:00+00'

# сессия 2: access токен в БД не хранится (JWT)
- auth_token: refresh-a-2
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 2
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: '2099-02-02 00:00:00+00'

# сессия 3: действующий refresh токен уже истёк
- auth_token: refresh-a-3
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 3
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '1 minute'
