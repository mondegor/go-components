---
- auth_token: refresh-old
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '3 hours'

# два истёкших refresh токена одной сессии
- auth_token: refresh-mid-1
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 2
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '150 minutes'
- auth_token: refresh-mid-2
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 2
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 2 # REVOKED
  expires_at: RAW=NOW() - interval '2 hours'
- auth_token: refresh-new
  token_type: 2 # REFRESH
  user_id: b0000000-0000-4000-8000-00000000000b
  realm_id: 1
  session_id: 3
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '1 hour'

# живой токен
- auth_token: refresh-live
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 4
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() + interval '1 hour'

# истёкший access токен удаляется отдельной очисткой (DeleteExpiredNonRefresh)
- auth_token: access-expired
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 5
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '4 hours'
