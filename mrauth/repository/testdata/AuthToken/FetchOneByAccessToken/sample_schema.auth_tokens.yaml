---
- auth_token: access-live
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() + interval '1 hour'

# отозванный токен
- auth_token: access-revoked
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 2
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 2 # REVOKED
  expires_at: RAW=NOW() + interval '1 hour'

# истёкший, но не отозванный токен
- auth_token: access-expired
  token_type: 1 # ACCESS
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 3
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() - interval '1 minute'

# действующий токен другого типа
- auth_token: refresh-live
  token_type: 2 # REFRESH
  user_id: a0000000-0000-4000-8000-00000000000a
  realm_id: 1
  session_id: 1
  token_scopes: '{"realm":"app/users","kind":"regular","lang":"ru-RU","tz":"Europe/Moscow"}'
  token_status: 1 # ENABLED
  expires_at: RAW=NOW() + interval '1 hour'
