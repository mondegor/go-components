post:
  summary: Auth/SC/R3. Метод создания операции на установку пароля пользователя (2FA)
  description: |-
    Метод предназначен для создания операции установки пароля текущего пользователя в качестве
    второго фактора (2FA по паролю).

    **Важно:** установить пароль как 2FA можно только когда 2FA **выключена**. Если уже включён
    любой второй фактор (пароль или TOTP), метод возвращает ошибку — сначала нужно отключить 2FA
    через `POST /v1/security/disable2fa`, и только затем установить новый пароль.

    ### Алгоритм установки пароля как 2FA (2FA выключена):
    1. `POST /v1/security/password` (новый пароль) — отправляется код подтверждения на текущий емаил;
    2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
    3. Пользователь применяет операцию методом `POST /v1/security/apply-password` — включается 2FA
      по паролю и единоразово возвращается набор одноразовых аварийных кодов (их нужно сохранить —
      повторно они не показываются);
    4. На текущий емаил отправляется уведомление, что включена 2FA по паролю;

    ### Значения `code` в ответе `400`
    - `ValidateError/new_password` — новый пароль не указан или не соответствует требованиям
      безопасности;

    ### Причины ответа `403`
    - общие причины отказа — см. «Аутентификация и доступ» в описании API;

    ### Причины ответа `409`
    - 2FA уже включена: установить новый второй фактор можно только после её отключения
      через `POST /v1/security/disable2fa`;
  operationId: changeUser2faPassword
  tags:
    - Auth.Security
  x-auth-scopes:
    - any-users

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Security.Request.Model.ChangePassword.yaml"

  responses:
    "200":
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "409":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error409.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
