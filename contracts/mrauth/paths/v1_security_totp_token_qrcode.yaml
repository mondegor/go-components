get:
  summary: Auth/SC/R4c. Метод возвращает QR-код TOTP генератора для 2FA аутентификации пользователя
  description: |-
    Метод возвращает QR-код (изображение) для добавления генератора в приложение 2FA
    аутентификации, построенный на основе секрета, который уже сохранён в операции.
    При этом сам TOTP генератор пока не активируется и 2FA не включается: для этого пользователь
    должен подтвердить владение генератором, отправив код из приложения через
    `POST /v1/security/apply-totp`, который и активирует генератор, включит 2FA и единоразово
    выдаст набор одноразовых аварийных кодов.

    Это второе представление той же заготовки генератора: тот же секрет строкой (и ссылкой
    `otpauth://`) отдаёт `GET /v1/security/totp/{token}`.

    Параметры генератора (период, число цифр, алгоритм, допуск при проверке) — те же, что
    описаны в `GET /v1/security/totp/{token}`.

    ### Значения `code` в ответе `400`
    Токен операции передаётся path-параметром, а не полем тела, поэтому имя поля к кодам
    не добавляется. Токен неверной длины отдельно не проверяется и отклоняется так же, как неизвестный, — `OperationInvalid`.
    - `OperationInvalid` — токен операции неизвестен, истёк или уже использован;
    - `OperationIsNotConfirmed` — операция ещё не подтверждена: сначала нужно пройти
      подтверждение через `PATCH /v1/operation/confirm`;
    - `OperationAlreadyExpired` — срок жизни операции истёк, её нужно создавать заново;

    ### Причины ответа `403`
    - указанная операция принадлежит другому пользователю;
    - токен указывает на операцию другого типа, а не на установку TOTP генератора
      (`POST /v1/security/totp`);
    - общие причины отказа — см. «Аутентификация и доступ» в описании API;
  operationId: renderTotpGeneratorQr
  tags:
    - Auth.Security
  x-auth-scopes:
    - any-users

  parameters:
    - $ref: "../components/parameters/Auth.Security.Request.Path.Token.yaml"

  responses:
    '200':
      description: QR-код TOTP генератора (изображение для сканирования приложением 2FA)
      content:
        image/png:
          schema:
            type: string
            format: binary
    '400':
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    '401':
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    '403':
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    '500':
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
