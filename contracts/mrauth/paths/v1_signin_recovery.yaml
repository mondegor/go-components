post:
  summary: Auth/R2b. Метод входа пользователя, утратившего доступ к почте
  description: |-
    Метод предназначен для входа пользователя, который не может получить код с емаила.
    Вход подтверждается комбинацией «пароль/TOTP + аварийный код», письмо при этом
    не отправляется.

    ### Алгоритм входа:
    1. Пользователь указывает свой емаил или телефон в качестве логина;
    2. Пользователю предлагается ввести пароль или TOTP код (`PATCH /v1/operation/confirm`,
      `confirm_method` — `PASSWORD` либо `TOTP`);
    3. Затем предлагается ввести один из одноразовых аварийных кодов
      (`confirm_method` — `RECOVERY`);
    4. Пользователь получает доступ к своему аккаунту (`POST /v1/session`);

    Аварийный код стоит последним звеном не случайно: он гасится в момент предъявления,
    поэтому предъявить его раньше, чем комбинация принята целиком, нельзя. За один вход
    расходуется не более одного кода.

    Комбинации с кодом из письма даёт обычный `POST /v1/signin`: там аварийный код тоже
    принимается, но вместо второго фактора и без объявления заранее. Здесь же кода из письма
    в цепочке нет вовсе, поэтому у метода нет ни `429` с `Retry-After`, ни полей повторной
    отправки в ответе.

    Ответы метода одинаковы независимо от того, включена ли у аккаунта 2FA: аккаунту без неё
    операция создаётся такая же и с тем же набором полей. Подтвердить её он не сможет —
    доказательств у него нет, — но определить состояние аккаунта по ответам метода нельзя.

    ### Значения `code` в ответе `400`
    - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
      проверку схемы;
    - `LoginNotExists/user_login` — логин не зарегистрирован;

    ### Причины ответа `403`
    - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
      авторизован и повторно авторизовываться ему нельзя;
  operationId: authorizeUserByRecovery
  tags:
    - Auth
  x-auth-scopes:
    - guests-only

  security: []

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.AuthorizeUser.yaml"

  responses:
    "200":
      # Создана операция входа, ожидающая ввода второго фактора (письмо не отправлялось)
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
