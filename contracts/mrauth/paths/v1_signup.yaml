post:
  summary: Auth/R1. Метод создания нового пользователя в системе
  description: |-
    Метод предназначен для подготовки создания в БД системы новой учётной записи пользователя.

    ### Алгоритм создания нового пользователя:
    1. Пользователь указывает свой емаил в качестве логина;
    2. Отправляется код подтверждения на указанный емаил;
    3. Пользователь указывает полученный код и подтверждает регистрацию своего аккаунта;
    4. Создаётся аккаунт пользователя;
    5. Пользователь получает доступ к своему аккаунту;

    Язык и часовой пояс в теле запроса не передаются: они определяются по самому запросу
    (query-параметры `lang`/`tz`, затем заголовки `Accept-Language`/`X-Accept-Time-Zone`,
    затем значения приложения по умолчанию) и фиксируются на этом шаге, поэтому аккаунт
    создаётся с теми же настройками, с какими шла регистрация, даже если подтверждение кода
    придёт позже и из другого окружения. Изменить их потом можно через
    `POST /v1/user/settings`.

    ### Значения `code` в ответе `400`
    - `ValidateError/realm` / `ValidateError/user_email` — поле не указано или не проходит
      проверку схемы (в т.ч. когда realm не входит в список realm'ов приложения, а емаил
      не является адресом);
    - `EmailAlreadyExists/user_email` — емаил уже занят другим пользователем; суффикс указывает
      на поле формы, чтобы ошибка села под поле ввода;

    ### Причины ответа `403`
    - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
      авторизован и регистрировать нового пользователя ему нельзя;

    ### Причины ответа `429`
    - по этому емаилу уже идёт регистрация (код подтверждения отправлен недавно): анти-спам
      троттл. Ответ не раскрывает, зарегистрирован ли емаил, — он лишь сообщает, что попытку
      следует повторить через время из заголовка `Retry-After`;
  operationId: createUser
  tags:
    - Auth
  x-auth-scopes:
    - guests-only

  security: []

  parameters:
    - $ref: "../_shared/components/parameters/Api.Request.Header.AcceptLanguage.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Header.AcceptTimeZone.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Query.Language.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Query.TimeZone.yaml"

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.CreateUser.yaml"

  responses:
    "200":
      # На емаил было отправлено сообщение с кодом подтверждения создания пользователя
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "429":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error429.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
