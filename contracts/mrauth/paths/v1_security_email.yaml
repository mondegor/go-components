post:
  summary: Auth/SC/R1a. Метод создания операции на изменение емаила пользователя
  description: |-
    Метод предназначен для создания операции изменения емаила текущего пользователя.

    ### Алгоритм изменения емаила пользователя:
    1. `POST /v1/security/email` (новый емаил) — отправляется код подтверждения на **текущий**
      емаил: операция собирает доказательства владения аккаунтом, а не новым адресом;
    2. Пользователь указывает полученный код и подтверждает операцию (`PATCH /v1/operation/confirm`);
    3. Если 2FA включена — пользователю предлагается ввести пароль или TOTP код;
    4. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-email` —
      емаил **пока не меняется**: создаётся операция подтверждения владения новым адресом,
      код уходит на **новый** емаил, а на прежний — уведомление о запросе смены;
    5. Пользователь указывает код с нового адреса (`PATCH /v1/operation/confirm`, единственное
      звено `EMAIL`; повторный step-up не требуется — он оплачен на шаге 1);
    6. Пользователь применяет подтверждённую операцию методом `POST /v1/security/apply-operation` —
      емаил изменяется на новый, прочие незавершённые операции пользователя отзываются,
      на прежний емаил отправляется уведомление;

    Пока созданная на шаге 4 операция не применена, адрес аккаунта остаётся прежним, а саму
    операцию видно в `GET /v1/user` (`pending_operations`) вместе со сроком истечения; отозвать
    её можно методом `PATCH /v1/operation/revoke`, по истечении срока она закрывается сама.
    Включение или отключение 2FA отзывает начатую смену вместе с остальными незавершёнными
    операциями пользователя (см. описание API). Знание одного лишь кода с нового адреса смену
    не завершает — оба завершающих метода требуют сессии.

    Если 2FA включена, смена адреса требует пароль или TOTP код: после неё аккаунт продолжает
    зависеть от второго фактора, но уже не от прежнего емаила. Поэтому этим методом аварийный код
    не принимается ни на одном шаге — комбинация «код с емаила + аварийный код» отклоняется.
    У аккаунта с выключенной 2FA второго фактора нет вовсе, и цепочка ограничивается кодом
    с текущего емаила.
    Комбинация «пароль/TOTP + аварийный код» — это выход из сценария утраченного доступа
    к почте, и создаётся она отдельным методом `POST /v1/security/email/recovery`.

    ### Влияние на сессии
    Сессии и токены не затрагиваются — см. описание API.

    ### Значения `code` в ответе `400`
    - `ValidateError/new_email` — новый емаил не указан или не проходит проверку схемы (в т.ч.
      когда значение не является емаил адресом);
    - `EmailAlreadyExists/new_email` — новый емаил уже используется другим пользователем;

    ### Причины ответа `403`
    - общие причины отказа — см. «Аутентификация и доступ» в описании API;
  operationId: changeUserEmail
  tags:
    - Auth.Security
  x-auth-scopes:
    - any-users

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Security.Request.Model.ChangeEmail.yaml"

  responses:
    "200":
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
