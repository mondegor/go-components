post:
  summary: Auth/R7. Метод изменения языка и часового пояса пользователя
  description: |-
    Метод предназначен для изменения языка (локали) и часового пояса текущего пользователя.
    Сохраняются всегда обе настройки, но оба поля тела необязательны, и незаполненное поле
    означает **режим «авто»**: настройка определяется по самому запросу — так же, как при
    регистрации (`POST /v1/signup`). Поэтому присылать нужно только те настройки,
    которые пользователь задал явно.
    Приоритет источников в режиме «авто»: query-параметр (`lang`/`tz`), затем заголовок клиента
    (`Accept-Language`/`X-Accept-Time-Zone`), затем значение приложения по умолчанию.
    Уже сохранённые настройки пользователя в подборе **не участвуют**: в режиме «авто» клиент
    просит определить настройку по своему текущему окружению, а не вернуть ту, что уже задана.
    В ответе возвращаются оба сохранённых значения, чтобы клиент применил у себя и подобранное.
    Указанные явно значения проверяются строго: принимаются только язык и часовой пояс,
    поддерживаемые приложением; подбор ближайшего здесь не выполняется.
    Сохранённые язык и часовой пояс попадают в access-токен только после ближайшего
    продления сессии (`PATCH /v1/session`), так как фиксируются в токене на момент выпуска;
    до этого `GET /v1/user` отдаёт признак `settings_pending: true`
  operationId: changeUserSettings
  tags:
    - Auth
  x-auth-scopes:
    - any-users

  parameters:
    - $ref: "../_shared/components/parameters/Api.Request.Header.AcceptLanguage.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Header.AcceptTimeZone.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Query.Language.yaml"
    - $ref: "../_shared/components/parameters/Api.Request.Query.TimeZone.yaml"

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.ChangeUserSettings.yaml"

  responses:
    "200":
      description: Язык и часовой пояс пользователя обновлены
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../components/models/Auth.Response.Model.UserSettings.yaml"
    "400":
      # Язык не соответствует формату кода языка с необязательным кодом региона
      # Язык не поддерживается приложением
      # Имя часового пояса не соответствует формату IANA-имени
      # Часовой пояс не предоставляется приложением
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
