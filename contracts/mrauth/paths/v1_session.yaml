post:
  summary: Auth/R3. Метод открытия новой сессии пользователя
  description: |-
    Метод предназначен для открытия новой сессии пользователя по подтверждённой операции,
    при этом возвращаются сгенерированные access и refresh токены для поддержания активности сессии.

    В теле запроса указывается `token` - токен операции входа (`POST /v1/signin`) или регистрации
    (`POST /v1/signup`), а именно токен последнего полученного звена цепочки подтверждений.

    При передачи параметра useCookie=true новый refreshToken вернётся в заголовке Set-Cookie.

    ### Когда указывается `secret`
    Метод совмещает два шага: подтверждает текущее звено операции и, если звеньев не осталось,
    открывает сессию (этим он и отличается от `POST /v1/security/apply-*`, которым нужна уже
    подтверждённая операция). Отсюда правило:

    - операция подтверждена **не полностью** - `secret` обязателен: в нём передаётся код с
      емаила/телефона либо пароль/TOTP код (или аварийный код) звена второго фактора. Если после
      этого звенья ещё остаются, возвращается `200` с `WaitingConfirmOperation` следующего звена,
      иначе `201`;
    - операция подтверждена **полностью** - `secret` не указывается, подтверждать нечего. Так
      бывает, когда последнее звено пройдено через `PATCH /v1/operation/confirm` (ответ `204`),
      а также при повторе запроса после `429` или сетевого сбоя: подтверждённая операция не
      расходуется до успешного открытия сессии, поэтому вход повторяется тем же токеном
      (см. «Причины ответа `429`»). Повторный вызов по подтверждённой операции идемпотентен,
      переданный в этом случае `secret` игнорируется;

    ### Значения `code` в ответе `400`
    - `ValidateError/token` / `ValidateError/secret` — поле не проходит проверку схемы
      (для `secret` в том числе пустой строкой; само отсутствие поля схему не нарушает);
    - `ConfirmCodeIsRequired/secret` — операция подтверждена не полностью, а `secret` не передан:
      подтверждать нечем. Это не ошибка ввода, а его отсутствие — попытка не расходуется,
      и клиенту нужно показать ввод секрета текущего звена; ответ дополнен объектом
      `operation_state` с актуальными счётчиками операции;
    - `ConfirmCodeIsIncorrect/secret` / `NoAttemptsToConfirmOperation/secret` — код подтверждения
      неверен либо исчерпаны попытки подтверждения; ответ дополнен объектом `operation_state`
      с актуальными счётчиками операции;
    - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
    - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

    ### Причины ответа `403`
    - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
      авторизован и открывать новую сессию ему нельзя;
    - указанный токен относится к операции, которая не является регистрацией или входом
      в систему, поэтому открыть по ней сессию нельзя;
    - привязка пользователя к realm'у операции снята между её созданием и входом:
      доступ к контуру отозван, войти по этой операции нельзя;

    ### Причины ответа `409`
    - подтверждается звено второго фактора, но 2FA была отключена после создания операции:
      вход по ней завершить нельзя, нужен новый `POST /v1/signin`;

    ### Причины ответа `429`
    - превышен лимит одновременных сессий (hard-порог): вход отклонён до тех пор, пока фоновая
      чистка не освободит место. Подтверждённая операция при этом не расходуется, поэтому
      повторить нужно вход тем же токеном (уже без `secret`) — через время из заголовка
      `Retry-After` и пока не истёк срок жизни операции;
  operationId: openUserSession
  tags:
    - Auth
  x-auth-scopes:
    - guests-only

  security: []

  parameters:
    - $ref: "../components/parameters/Auth.Request.Header.Web.UseCookie.yaml"

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.LoginByToken.yaml"

  responses:
    "200":
      # На емаил/телефон было отправлено сообщение с кодом подтверждения авторизации пользователя
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "201":
      # Открыта новая сессия пользователя и сгенерированы Refresh и Access токены
      # Регенерированы Refresh и Access токены для текущей сессии пользователя
      $ref: "../components/responses/Auth.ResponseJson.SuccessAccess.yaml"
    "400":
      $ref: "../components/responses/Auth.ResponseJson.Error400.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "409":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error409.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "429":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error429.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"

patch:
  summary: Auth/R4. Метод продления текущей сессии пользователя
  description: |-
    Метод предназначен для продления текущей сессии пользователя по указанному refreshToken,
    при этом возвращаются новые сгенерированные access и refresh токены для поддержания активности сессии.
    Идентификатор сессии (sid) сохраняется — продление происходит в рамках той же сессии.

    Важно! RefreshToken одноразовый. В течение короткого grace-окна (≈60 секунд) после ротации
    повторный запрос с тем же refreshToken вернёт те же ранее выданные токены (идемпотентный
    ретрай — для устойчивости к гонкам и повторам сети между вкладками).

    Повторное использование того же refreshToken вне grace-окна трактуется как компрометация:
    текущая сессия принудительно закрывается (отзываются её refresh-линия и видимость сессии),
    остальные сессии пользователя не затрагиваются. (В будущем при наличии fingerprint устройства
    сильный сигнал кражи сможет эскалировать отзыв до всех сессий пользователя.)

    Если в заголовке запроса будет присутствовать кука под именем RTID, то в ней должен лежать
    refreshToken. Иначе refreshToken должен находиться в теле запроса.

    Если refreshToken был найден в куке RTID, то новый refreshToken вернётся в заголовке Set-Cookie.

    ### Значения `code` в ответе `400`
    - `ValidateError/refresh_token` — refresh токен не указан или не проходит проверку схемы;

    ### Причины ответа `401`
    - refresh токен неизвестен, истёк или уже был использован (в том числе когда сессия закрыта
      из-за повторного использования токена). Продлевать нечего — нужен новый вход
      (`POST /v1/signin` → `POST /v1/session`). Ответ не зависит от того, пришёл токен полем
      тела или кукой RTID, и, как все ответы `401`, кода ошибки в теле не несёт;
  operationId: continueUserSession
  tags:
    - Auth

  security: []

  parameters:
    - $ref: "../components/parameters/Auth.Request.Cookie.Web.RefreshToken.yaml"

  requestBody:
    required: false
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.ContinueSession.yaml"

  responses:
    "201":
      # Регенерированы Refresh и Access токены для текущей сессии пользователя (sid сохраняется)
      $ref: "../components/responses/Auth.ResponseJson.SuccessAccess.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"

delete:
  summary: Auth/R5. Метод закрытия текущей сессий пользователя
  description: |-
    Метод предназначен для закрытия текущей сессии пользователя.

    Если в заголовке запроса присутствует кука RTID, refreshToken берётся из неё и тело не требуется
    (web-клиент). Иначе (мобайл/API-клиент) refreshToken должен быть передан в теле запроса.

    Метод идемпотентен: повторное закрытие уже закрытой сессии, как и неизвестный refresh токен,
    молча игнорируется и также возвращает `204`.

    ### Значения `code` в ответе `400`
    - `ValidateError/refresh_token` — refresh токен не указан или не проходит проверку схемы;

    ### Причины ответа `403`
    - общие причины отказа — см. «Аутентификация и доступ» в описании API;
  operationId: closeUserSession
  tags:
    - Auth
  x-auth-scopes:
    - any-users

  parameters:
    - $ref: "../components/parameters/Auth.Request.Cookie.Web.RefreshToken.yaml"

  requestBody:
    required: false
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.ContinueSession.yaml"

  responses:
    "204":
      description: Текущая сессия пользователя была закрыта
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
