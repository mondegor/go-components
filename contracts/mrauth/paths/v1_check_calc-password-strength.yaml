post:
  summary: Auth/CK/R2. Метод рассчитывает надёжность указанного пароля
  description: |-
    Метод предназначен для расчёта надёжности указанного пароля.

    Поле `accept_status` сообщает, примет ли пароль `POST /v1/security/password` (`ACCEPTED`), а если
    нет — причину отказа (`TOO_WEAK` или `RECOVERY_CODE_FORMAT`); причина соответствует коду ответа
    `400` метода `POST /v1/security/password`.

    ### Значения `code` в ответе `400`
    - `ValidateError/password` — пароль не указан или не проходит проверку схемы;
  operationId: calcPasswordStrength
  tags:
    - Auth.Check

  security: []

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Check.Request.Model.CalcPasswordStrength.yaml"

  responses:
    "200":
      description: Сформирован ответ с информацией о надёжности пароля
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../components/models/Auth.Check.Response.Model.CalcPasswordStrength.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
