post:
  summary: Auth/R2a. Метод авторизации пользователя в системе
  description: |-
    Метод предназначен для авторизации пользователя под указанным емаилом/телефоном.

    ### Алгоритм авторизации пользователя:
    1. Пользователь указывает свой емаил/телефон в качестве логина;
    2. Отправляется код подтверждения на указанный емаил или на емаил привязанный к указанному телефону;
    3. Пользователь указывает полученный код и подтверждает авторизацию;
    4. Если 2FA включена:\
      4.1. Пользователю предлагается ввести пароль или TOTP-код;\
      4.2. Пользователь указывает его и получает доступ к своему аккаунту;
    5. Если 2FA выключена:\
      5.1. Пользователь получает доступ к своему аккаунту;

    Вход принимает три комбинации доказательств: «код с емаила + пароль/TOTP»,
    «код с емаила + аварийный код» и «пароль/TOTP + аварийный код». Первые две обслуживает этот
    метод: на шаге 4.1 в поле `secret` вводится пароль/TOTP-код **либо** один из одноразовых
    аварийных кодов, объявлять выбор заранее не нужно. Третья комбинация — для утративших доступ
    к почте, её создаёт отдельный метод `POST /v1/signin/recovery`.

    За один вход расходуется не более одного аварийного кода: предъявить его можно только
    на последнем звене цепочки. Аварийные коды выдаются при включении 2FA и при их перевыпуске.

    До первого успешного доказательства ответы метода подтверждения одинаковы для аккаунтов
    с включённой и выключенной 2FA: по ним нельзя определить состояние аккаунта. То же верно
    и для `POST /v1/signin/recovery`.

    ### Значения `code` в ответе `400`
    - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
      проверку схемы (в т.ч. когда realm не входит в список realm'ов приложения, а логин
      не является емаилом/телефоном);
    - `LoginNotExists/user_login` — пользователя с таким логином нет;

    ### Причины ответа `403`
    - метод гостевой: запрос выполнен с действующим access-токеном, то есть вызывающий уже
      авторизован и повторно авторизовываться ему нельзя;
  operationId: authorizeUser
  tags:
    - Auth
  x-auth-scopes:
    - guests-only

  security: []

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Request.Model.AuthorizeUser.yaml"

  responses:
    "200":
      # На емаил/телефон было отправлено сообщение с кодом подтверждения авторизации пользователя
      $ref: "../components/responses/Auth.ResponseJson.WaitingConfirmOperation.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
