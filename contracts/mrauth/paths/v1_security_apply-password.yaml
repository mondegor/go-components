post:
  summary: Auth/SC/R4. Метод применяет подтверждённую операцию смены пароля и выдаёт аварийные коды
  description: |-
    Метод завершает установку пароля как 2FA после подтверждения операции, созданной
    методом `POST /v1/security/password`. При успехе 2FA по паролю включается и единоразово
    возвращается набор одноразовых аварийных кодов (их нужно сохранить — повторно они
    не показываются). Активный второй фактор метод не заменяет: чтобы задать новый пароль,
    текущий 2FA нужно сначала отключить через `POST /v1/security/disable2fa`.

    ### Влияние на сессии
    Сессии и токены не затрагиваются: текущая сессия сохраняется, refresh токен не ротируется,
    остальные открытые сессии не закрываются, повторный вход не требуется. Клиенту достаточно
    перечитать профиль (`GET /v1/user`). Закрыть прочие сессии после смены второго фактора
    пользователь при желании может сам — `GET /v1/sessions` и `POST /v1/sessions/close`.

    ### Значения `code` в ответе `400`
    - `ValidateError/token` — токен операции не указан или не проходит проверку схемы;
    - `OperationInvalid/token` — токен операции неизвестен, истёк или уже использован;
    - `OperationIsNotConfirmed/token` — операция ещё не подтверждена: сначала нужно пройти
      подтверждение через `PATCH /v1/operation/confirm`;
    - `OperationAlreadyExpired/token` — срок жизни операции истёк, её нужно создавать заново;

    ### Причины ответа `403`
    - указанная операция принадлежит другому пользователю;
    - токен указывает на операцию другого типа, а не на установку/смену пароля
      (`POST /v1/security/password`);
    - общие причины отказа — см. «Аутентификация и доступ» в описании API;

    ### Причины ответа `409`
    - 2FA была включена после создания операции (например, привязан TOTP-генератор):
      активный второй фактор не перезаписывается, его нужно сначала отключить
      через `POST /v1/security/disable2fa`;
  operationId: applyUser2faPassword
  tags:
    - Auth.Security
  x-auth-scopes:
    - any-users

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Security.Request.Model.ApplyByToken.yaml"
  responses:
    '200':
      description: Пароль установлен как 2FA, возвращены аварийные коды
      content:
        application/json;charset=UTF-8:
          schema:
            $ref: "../components/models/Auth.Security.Response.RecoveryCodes.yaml"
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "401":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error401.yaml"
    "403":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error403.yaml"
    "409":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error409.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
