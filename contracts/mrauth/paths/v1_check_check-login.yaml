post:
  summary: Auth/CK/R1. Метод проверяет свободен ли указанный емаил/телефон
  description: |-
    Метод предназначен для проверки возможности регистрации пользователя с помощью указанного
    емаила/телефона

    ### Значения `code` в ответе `400`
    - `ValidateError/realm` / `ValidateError/user_login` — поле не указано или не проходит
      проверку схемы (в т.ч. когда логин не является емаилом/телефоном);
    - `EmailAlreadyExists/user_login` / `PhoneAlreadyExists/user_login` — логин уже занят
      другим пользователем;
  operationId: checkLogin
  tags:
    - Auth.Check

  security: []

  requestBody:
    required: true
    content:
      application/json;charset=UTF-8:
        schema:
          $ref: "../components/models/Auth.Check.Request.Model.CheckLogin.yaml"

  responses:
    "204":
      description: Указанный емаил/телефон свободен для регистрации пользователя
    "400":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error400.yaml"
    "422":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error422.yaml"
    "500":
      $ref: "../_shared/components/responses/Api.ResponseJson.Error5xx.yaml"
