description: DTO пользовательской ошибки 400
type: object
required:
  - code
  - detail
properties:
  code:
    description: |-
      Идентификатор ошибки. Принимает одну из двух форм:
      - `ErrorCode` — запрос отклонён по существу, а не по значению конкретного поля;
        поля формы у такой ошибки нет;
      - `ErrorCode/field_name` — ошибка относится к значению поля запроса. Суффикс после первого
        `/` совпадает с именем поля в JSON, поэтому такую ошибку клиент может показать прямо
        под соответствующим полем формы, а префикс объясняет причину отказа;

      Отсюда правило для клиента: разделить значение по первому `/`; если суффикс есть и
      совпал с полем формы — показать ошибку под этим полем, иначе (суффикса нет либо такого
      поля в форме нет) показать общим уведомлением. Значения, возможные у конкретного метода,
      перечислены в его описании.
    type: string
    example: "ValidateError/user_email"
  detail:
    description: Описание ошибки
    type: string
    example: "Атрибут не может быть пустым"
