description: |-
  Язык пользователя (BCP 47, напр. ru-RU), на нём отдаются текстовые сообщения и уведомления.
  Приоритет применения языка:
    1. query-параметр lang (этот параметр) — наивысший приоритет, разовое переопределение на запрос;
    2. язык из действующего access токена — для авторизованных запросов;
    3. заголовок Accept-Language (список с весами q);
    4. язык системы по умолчанию.
  Первые два источника строгие: значение принимается только при точном совпадении с одним
  из поддерживаемых приложением языков, подбор ближайшего здесь не выполняется (напр. fr-CH
  при поддержке fr совпадением не считается). По заголовку Accept-Language, наоборот,
  подбирается ближайший поддерживаемый язык.
  Невалидный/неподдерживаемый источник пропускается — применяется следующий по приоритету.
  Невалидный параметр игнорируется, поведение не меняет.
name: lang
in: query
required: false
schema:
  type: string
  maxLength: 5
example: "ru-RU"
