description: |-
  Предпочтительный часовой пояс пользователя. Стандартного заголовка для часового пояса нет,
  поэтому введён свой, по образцу Accept-Language.
  Первый сегмент без "=" — IANA-имя пояса, остальные сегменты — параметры offset (смещение
  относительно UTC в формате ±HH:MM) и dst (признак летнего времени, 0 или 1). Любая часть
  необязательна: параметры служат запасным путём на случай, когда имя приложению неизвестно,
  и позволяют подобрать по смещению ближайший из его поясов.
  Формат строгий: пробелы в значении не допускаются нигде — ни вокруг сегментов, ни вокруг "=".
name: X-Accept-Time-Zone
in: header
required: false
schema:
  type: string
example: "Europe/Moscow;offset=+03:00;dst=0"
