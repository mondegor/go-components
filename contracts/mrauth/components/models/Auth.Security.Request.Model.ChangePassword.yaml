type: object
required:
  - new_password
properties:
  new_password:
    description: |-
      Новый пароль пользователя: латинские буквы, цифры и спецсимволы
      (любые печатные символы ASCII, кроме пробела)
    type: string
    minLength: 10
    maxLength: 32
    # pattern: "^[!-~]+$"
    example: "L$QI.qA6eu7zG%7w"
