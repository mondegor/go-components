type: object
required:
  - lang
  - tz
properties:
  lang:
    description: |-
      Язык (локаль) пользователя, который был сохранён.
      Если поле lang в запросе не заполнялось (режим «авто»), здесь возвращается
      подобранный язык; клиент применяет у себя именно это значение
    type: string
    minLength: 2
    maxLength: 5
    example: "ru-RU"
  tz:
    description: |-
      Часовой пояс пользователя (IANA-имя), который был сохранён.
      Если поле tz в запросе не заполнялось (режим «авто»), здесь возвращается
      подобранный пояс; клиент применяет у себя именно это значение
    type: string
    minLength: 3
    maxLength: 64
    example: "Europe/Moscow"
