type: object
properties:
  lang:
    description: |-
      Язык (локаль) пользователя - код языка и необязательный код региона.
      Необязателен: если поле не указано (или пустое), то включается режим «авто» - язык
      определяется по самому запросу (см. описание метода), а не остаётся прежним.
      Указанный явно язык должен точно совпадать с одним из поддерживаемых приложением.
    type: string
    maxLength: 5
    # pattern: "^[a-zA-Z]{2,3}([-_][a-zA-Z]{2})?$"
    example: "ru-RU"
  tz:
    description: |-
      Часовой пояс пользователя (IANA-имя).
      Необязателен: если поле не указано (или пустое), то включается режим «авто» - пояс
      определяется по самому запросу (см. описание метода), а не остаётся прежним.
      Указанное явно имя должно точно совпадать с одним из часовых поясов поддерживаемых приложением.
    type: string
    maxLength: 64
    # pattern: "^[A-Za-z][A-Za-z0-9+_-]*(/[A-Za-z0-9+_-]+){0,2}$"
    example: "Europe/Moscow"
