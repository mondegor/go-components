type: object
required:
  - realm
  - user_login
properties:
  realm:
    description: Область, пространство, в котором проверяется логин
    type: string
    minLength: 4
    maxLength: 32
    example: "domain_name/user_group"
  user_login:
    description: Емаил или телефон, занятость которого проверяется
    type: string
    minLength: 7
    maxLength: 64
    example: "user-email@example.com"
