allOf:
  - $ref: "./Auth.Response.Model.ConfirmOperationState.yaml"
  - type: object
    required:
      - token
      - confirm_method
    properties:
      token:
        description: |-
          Токен операции, с помощью которой проводится процедура подтверждения подлинности пользователя.
          Токен принадлежит текущему звену цепочки подтверждений: при переходе к следующему звену
          выдаётся новый токен, а предыдущий сразу перестаёт действовать. Поэтому клиент всегда
          работает с токеном последнего полученного звена - им же вызывается и завершающий метод
          операции (`POST /v1/security/apply-*`)
        type: string
        maxLength: 128
        example: "b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974"
      confirm_method:
        $ref: "../enums/Auth.Enum.ConfirmMethod.yaml"
      message:
        description: |-
          Человекочитаемое сообщение о том, что операция требует подтверждения,
          текст задаёт хост-приложение и зависит от сценария
        type: string
        example: "Для входа в систему необходимо ввести код подтверждения, отправленный на ваш емаил/телефон"
