type: object
required:
  - remaining_attempts
  - expires_in
properties:
  remaining_attempts:
    description: Оставшееся количество попыток ввода кода подтверждения
    type: integer
    minimum: 0
    example: 2
  remaining_resends:
    description: |-
      Оставшееся количество повторных отправок кода подтверждения; 0 означает,
      что отправки исчерпаны. Отсутствует вместе с resends_in, если повторные отправки
      не применимы (`PASSWORD`, `TOTP`, `RECOVERY`)
    type: integer
    minimum: 0
    example: 1
  resends_in:
    description: |-
      Количество оставшихся секунд по истечении которых можно сделать повторную отправку
      кода подтверждения; 0 означает, что её можно сделать прямо сейчас.
      Отсутствует вместе с remaining_resends, если повторные отправки не применимы
      (`PASSWORD`, `TOTP`, `RECOVERY`)
    type: integer
    minimum: 0
    example: 1
  expires_in:
    description: |-
      Количество оставшихся секунд до истечения срока жизни операции.
      Срок задаётся звену подтверждения приложением и продлевается по правилу:

      - **короткий** (не больше 30 минут) назначается заново, полностью, от момента шага:
        при переходе к следующему звену (`PATCH /v1/operation/confirm` → `200`), при повторной
        отправке кода (`PATCH /v1/operation/resend`) и при полном подтверждении
        (`PATCH /v1/operation/confirm` → `204`: подтверждённая операция получает срок последнего
        звена на вызов завершающего метода);
      - **долгий** (больше 30 минут) назначается один раз, при создании операции, и ни одним
        шагом не продлевается; подтверждённая операция живёт до того же срока.

      Неудачная попытка подтверждения срок не меняет — в `operation_state` отдаётся остаток
    type: integer
    minimum: 0
    example: 1
