type: object
required:
  - remaining_attempts
  - expires_in
properties:
  remaining_attempts:
    description: Оставшееся количество попыток ввода кода подтверждения
    type: integer
    example: 2
  remaining_resends:
    description: |-
      Оставшееся количество повторных отправок кода подтверждения.
      Отсутствует, если повторные отправки не применимы (пароль и TOTP)
    type: integer
    example: 1
  resends_in:
    description: |-
      Количество оставшихся секунд по истечении которых можно сделать повторную отправку
      кода подтверждения. Отсутствует, если повторные отправки не применимы (пароль и TOTP),
      а также если осталось 0 секунд, то есть повторную отправку можно сделать прямо сейчас
    type: integer
    example: 1
  expires_in:
    description: Количество оставшихся секунд до истечения срока действия подтверждения операции
    type: integer
    example: 1
