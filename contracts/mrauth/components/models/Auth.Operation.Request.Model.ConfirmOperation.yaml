description: DTO подтверждения операции, которая инициирована пользователем
type: object
required:
  - token
  - secret
properties:
  token:
    description: Токен для подтверждения операции
    type: string
    minLength: 64
    maxLength: 128
    example: "b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974"
  secret:
    description: |-
      Пароль, одноразовый пароль, код подтверждения, высланный на емаил/телефон, либо один
      из аварийных кодов — если текущее звено цепочки подтверждений его допускает.
      Границы `4..32` — общий диапазон размера на все форматы разом; фактический размер
      задаёт `confirm_method` текущего звена:
      - EMAIL - цифровой код, 4..8 символов;
      - PHONE - цифровой код, 4..8 символов (зарезервировано);
      - PASSWORD - 8..32 символа;
      - TOTP - 6-значный цифровой код;
      - RECOVERY - 8..32 символа;
    type: string
    minLength: 4
    maxLength: 32
    example: "183947"
