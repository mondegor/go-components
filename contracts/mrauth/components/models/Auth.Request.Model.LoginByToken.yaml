type: object
required:
  - token
properties:
  token:
    description: |-
      Токен операции входа или регистрации пользователя - токен последнего полученного
      звена цепочки подтверждений (см. описание метода)
    type: string
    minLength: 64
    maxLength: 128
    example: "b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974"
  secret:
    description: |-
      Пароль, одноразовый пароль или код подтверждения, высланный на емаил/телефон.
      Указывается, только пока в операции остаётся неподтверждённое звено; по полностью
      подтверждённой операции поле в теле не указывается (см. описание метода);
      пустая строка является невалидным значением.
    type: string
    minLength: 4
    maxLength: 32
    example: "183947"
