type: object
required:
  - token
properties:
  token:
    description: |-
      Токен операции входа или регистрации пользователя - токен последнего полученного
      звена цепочки подтверждений (см. описание метода)
    type: string
    minLength: 64
    maxLength: 128
    example: "b1d50cb1f3bc817f2be3a4b357929cee70402fb5463db25b91568a1801dc0974"
  secret:
    description: |-
      Пароль, одноразовый пароль, код подтверждения, высланный на емаил/телефон, либо один
      из аварийных кодов — если текущее звено цепочки подтверждений его допускает.
      Указывается, только пока в операции остаётся неподтверждённое звено; по полностью
      подтверждённой операции поле в теле не указывается (см. описание метода);
      пустая строка является невалидным значением.
      Границы `4..32` — общий диапазон размера на все форматы разом; фактический размер
      задаёт `confirm_method` текущего звена:
      - EMAIL - цифровой код, 4..8 символов;
      - PHONE - цифровой код, 4..8 символов (зарезервировано);
      - PASSWORD - пароль 2FA, формат не ограничивается сверх общих границ `4..32`
        (правила задаются при установке пароля, см. `POST /v1/security/password`);
      - TOTP - 6-значный цифровой код;
      - RECOVERY - 11..32 символа, латиница в верхнем регистре и цифры с разделителем `-` посередине;
    type: string
    minLength: 4
    maxLength: 32
    example: "183947"
