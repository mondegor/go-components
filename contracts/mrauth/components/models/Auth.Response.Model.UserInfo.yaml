type: object
required:
  - email
  - lang
  - tz
  - auth_2fa_type
  - realms
  - status
properties:
  email:
    type: string
    format: email
    maxLength: 64
    example: "user-email@example.com"
  phone:
    type: string
    format: phone
    maxLength: 32
    example: "+7 999 888 77 66"
  lang:
    description: >-
      Язык пользователя, сохранённый в его профиле. Тексты в ответах формируются
      по языку, зафиксированному в access-токене, поэтому после смены настроек
      и до продления сессии значения могут отличаться (см. settings_pending);
      на это время новый язык применяется к ответу query-параметром lang
    type: string
    maxLength: 5
    example: "ru-RU"
  tz:
    description: >-
      Часовой пояс пользователя (IANA-имя), сохранённый в его профиле.
      Даты/время в ответах форматируются по поясу, зафиксированному в access-токене,
      поэтому после смены настроек и до продления сессии значения могут отличаться
      (см. settings_pending); на это время новый пояс применяется к ответу
      query-параметром tz
    type: string
    maxLength: 64
    example: "Europe/Moscow"
  auth_2fa_type:
    $ref: "../enums/Auth.Enum.UserAuth2fa.yaml"
  realms:
    type: array
    items:
      $ref: "./Auth.Response.Model.UserRealm.yaml"
  status:
    $ref: "../enums/Auth.Enum.UserStatus.yaml"
  settings_pending:
    description: >-
      Признак того, что настройки, сохранённые в профиле, ещё не попали в предъявленный
      access-токен: язык или часовой пояс профиля отличается от зафиксированного в этом
      токене. Пока признак истинен, поля lang и tz отдают новые значения, а даты и тексты
      в ответах формируются по прежним; применить новые к конкретному ответу можно
      query-параметрами lang и tz - на сам признак они не влияют, он описывает токен,
      а не ответ. Гаснет сам после ближайшего продления сессии (PATCH /v1/session);
      отсутствие поля равнозначно false
    type: boolean
    default: false
    example: false
