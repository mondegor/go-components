description: |-
  Тип защищённой операции личного кабинета, ожидающей подтверждения либо применения:
  - CHANGE_EMAIL - смена емаила, шаг 1: подтверждение владения аккаунтом;
  - CHANGE_EMAIL_CONFIRM - смена емаила, шаг 2: подтверждение владения новым адресом;
  - DISABLE_2FA - отключение 2FA;
type: string
enum:
  - CHANGE_EMAIL
  - CHANGE_EMAIL_CONFIRM
  - DISABLE_2FA
example: "CHANGE_EMAIL_CONFIRM"
