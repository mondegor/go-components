description: |-
  Статус приёма пароля: примет ли его `POST /v1/security/password` при установке пароля как 2FA,
  а если нет — причина отказа:
  - ACCEPTED - пароль будет принят;
  - TOO_WEAK - надёжность пароля ниже порога, заданного приложением;
  - RECOVERY_CODE_FORMAT - пароль имеет формат аварийного кода (латиница в верхнем регистре и цифры
    с разделителем `-` посередине): на звене пароля такой ввод не отличить от аварийного кода;
    причина указывается независимо от надёжности, т. к. усиление пароля в том же формате её не устранит;
type: string
enum:
  - ACCEPTED
  - TOO_WEAK
  - RECOVERY_CODE_FORMAT
example: "ACCEPTED"
