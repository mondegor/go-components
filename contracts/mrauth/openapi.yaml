---
openapi: 3.0.3
info:
  version: LATEST
  title: Auth API
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  description: |-
    Auth REST API
    - При создании нового аккаунта, пользователь, в качестве логина должен указать свой емаил, на который будет отправлен код, для подтверждения емаила и активации аккаунта;
    - Для последующего входа пользователем в систему, ему нужно указать свой емаил/телефон и далее ввести код подтверждения отправленный на его емаил. При включенной 2FA ему дополнительно нужно будет ввести пароль/TOTP код от своей учётной записи (либо один из одноразовых аварийных кодов);
    - Пользователь с включённой 2FA, утративший доступ к почте, может войти и сменить емаил без кода из письма — комбинацией «пароль/TOTP + аварийный код» (методы `.../recovery`);
    - Авторизованный пользователь может:
      - включить 2FA аутентификацию, выбрав один из способов дополнительной проверки: по паролю или по TOTP коду;
      - отключить 2FA аутентификацию введя код с емаила и пароль/TOTP код (или вместо него одноразовый аварийный код, выданный при включении 2FA либо при перевыпуске кодов);
      - перевыпустить одноразовые аварийные коды;
      - изменить свой емаил — с подтверждением владения и аккаунтом, и новым адресом;
      - установить/изменить свой телефон — с подтверждением владения аккаунтом (код на текущий емаил); сам номер кодом не проверяется;
      - следить за всеми своими открытыми сессиями и закрыть любую из них при необходимости;
      - осуществлять особые операции требующие дополнительного подтверждения по емаилу или 2FA методами;

    Методы `Auth.Security` сессии и токены не затрагивают: текущая сессия сохраняется, refresh токен
    не ротируется, остальные открытые сессии не закрываются, повторный вход не требуется — изменения
    видны в профиле (`GET /v1/user`). Закрыть прочие сессии, например после смены
    второго фактора или адреса, пользователь при желании может сам — `GET /v1/sessions`
    и `POST /v1/sessions/close`.

    Включение или отключение 2FA отзывает **все** незавершённые операции пользователя — в том числе
    начатые вход, смену емаила или телефона: их цепочки подтверждения построены при прежнем
    состоянии 2FA. Так же действует и смена емаила (применение её второго шага): коды
    подтверждения и уведомления незавершённых операций привязаны к прежнему адресу.
    Такие операции нужно начать заново, их токены отвечают `OperationInvalid`.

    ### Аутентификация и доступ
    По умолчанию к методу применяется схема `bearerAuth` — заголовок `Authorization: Bearer <accessToken>`, объявленный в корневом `security`. Метод, которому токен не обязателен, отключает её собственным `security: []`.
    Расширение `x-auth-scopes` описывает, **кому метод предназначен**:
    - `guests-only` — только **неавторизованному** посетителю; сопровождается `security: []`, токен не требуется;
    - `any-users` — **любому авторизованному** пользователю, без ограничения по ролям; действует корневой `bearerAuth`, токен обязателен;
    - расширение **отсутствует** (при `security: []`) — метод доступен **и гостю, и авторизованному**: право на действие даёт не токен, а секрет в самом запросе (токен операции, refreshToken) либо метод публичен. Признак категории — именно допустимость авторизованного вызывающего, а не источник права: `POST /v1/session` тоже принимает токен операции, но остаётся `guests-only`, потому что открывать сессию уже авторизованному нельзя;

    Отсюда правило по кодам отказа:
    - `401` — негоден предъявленный **сессионный** токен: access-токен не предъявлен, неизвестен или истёк (методы `any-users`), либо refresh-токен неизвестен, истёк или уже использован (`PATCH /v1/session`, где право на действие даёт сам refresh-токен, а не схема). Отказ исправим: клиент продлевает сессию, а если продлить не удалось — входит заново. Тело ответа кода ошибки не несёт;
    - `403` — вызывающему это действие не разрешено: авторизованный пользователь обратился к `guests-only`-методу, пользоваться которым он не может, либо запрос отклонён принадлежностью или типом объекта, либо предъявленный access-токен не разрешён текущему контуру, либо access-токен не разобрался структурно (битая подпись, неизвестный идентификатор ключа, несовпадение алгоритма) — такой токен заведомо не выдавался сервером, поэтому продление сессии здесь не поможет;
    - `404` — запрошенный ресурс не существует в этом развёртывании. Причина отказа перечислена в описании метода;
    - `409` — запрос корректен и вызывающему разрешён, но отклонён **текущим состоянием ресурса**: требуемое действие в этом состоянии не имеет смысла. Повторять тот же запрос бессмысленно, пока состояние не изменится. Причина отказа однозначно задана самим методом и перечислена в его описании;
    - `422` — тело запроса не удалось разобрать: невалидный JSON, значение поля не того типа либо в теле присутствует **неизвестное поле** (лишние поля отклоняются). Разбор обрывается **до** проверки схемы JSON. Повторять тот же запрос бессмысленно — причина в самом клиенте, а не в состоянии сервера. Возможен у **любого** метода, принимающего тело запроса;
    - `429` — запрос корректен, но отклонён **временно**: анти-спам троттл или исчерпанный ресурс сервера. Повторить следует тот же запрос через время из заголовка `Retry-After`; заголовок необязателен — если сервер не берётся назвать срок, клиент выбирает паузу сам. Причина отказа однозначно задана самим методом и перечислена в его описании;

    ### Общие параметры запросов
    Перечисленные ниже параметры необязательны и принимаются **всеми методами** API, поэтому у каждого метода отдельно не перечисляются:
    - `Accept-Language` (заголовок) / `lang` (query-параметр) — предпочтительный язык пользователя;
    - `X-Accept-Time-Zone` (заголовок) / `tz` (query-параметр) — предпочтительный часовой пояс пользователя;
    - `X-Correlation-Id` (заголовок) — уникальный идентификатор клиента для сквозной трассировки запроса.

    Ни один из этих параметров **не может стать причиной отказа**: невалидное или неподдерживаемое значение
    молча игнорируется — для языка и часового пояса применяется следующий источник по приоритету, — поэтому
    кода ошибки по ним не бывает ни у одного метода.

    Исключение — `POST /v1/signup` и `POST /v1/user/settings`: там язык и часовой пояс не только применяются
    к самому ответу, но и сохраняются в профиль пользователя, поэтому у этих двух методов они объявлены явно.

    Приоритет применения языка и часового пояса описан ниже в разделе «Локализация и время».

    ### Локализация и время
    - Все сущностные даты/время в ответах отдаются в **часовом поясе пользователя** в формате RFC3339 со смещением (например `2020-01-01T15:00:00+03:00`);
    - Текстовые сообщения (`message`) и уведомления отдаются на **языке пользователя**;
    - **Язык** и **часовой пояс** определяются по одному и тому же приоритету источников и авторизации не требуют — оба применяются в том числе к гостевым запросам:
      1. query-параметр запроса — `lang` (например `ru-RU`) / `tz` (например `Europe/Moscow`) — наивысший приоритет, разовое переопределение на конкретный запрос;
      2. access-токен — для **авторизованных** запросов сервер подставляет язык и пояс, зафиксированные в токене на момент его выпуска. Задать их можно при регистрации (`POST /v1/signup`) и изменить позже (`POST /v1/user/settings`);
      3. заголовок клиента — `Accept-Language` (список с весами `q`) / `X-Accept-Time-Zone` (например `Europe/Moscow;offset=+03:00;dst=0`);
      4. значение по умолчанию — язык и часовой пояс системы;
    - Первые два источника **строгие**: значение принимается, только если оно точно совпадает с поддерживаемым приложением (`?lang=fr-CH` при поддержке `fr` совпадением не считается). Заголовок клиента разбирается терпимее — по нему подбирается ближайшее поддерживаемое значение: у языка по тегам, у пояса по параметрам `offset` и `dst`, когда его имя приложению неизвестно;
    - Невалидное значение источника пропускается — применяется следующий по приоритету;
    - Изменённые через `POST /v1/user/settings` язык и часовой пояс применяются к ответам **только после ближайшего продления сессии** (`PATCH /v1/session`), которое клиент выполняет штатно для поддержания активности сессии, — **повторный вход не требуется**. Верхняя граница окна рассинхрона — остаток времени жизни текущего access-токена (`expires_in` из ответа на открытие/продление сессии); до продления сервер продолжает отвечать в прежнем языке и поясе. Поля `lang` и `tz` в `GET /v1/user` читаются из профиля, то есть отдают уже новые значения, поэтому в этом окне они могут не совпадать с языком и поясом, применёнными к тому же ответу. Применить новые значения к конкретному ответу, не дожидаясь продления сессии, можно параметрами `lang` и `tz`;
    - Время **возникновения ошибки** (`time` в объектах ошибок) — это системное время и всегда отдаётся в **UTC**, независимо от часового пояса пользователя.

    ### Ограничения полей и ошибки `400`

    #### Ограничения полей
    - required - поле обязательно для заполнения;
    - min=N - поле должно быть не менее N символов;
    - max=N - поле должно быть не более N символов;
    - enum - поле должно содержать одно из ENUM значений;

    #### Значения `code` в ответе `400`
    Ответ `400` содержит список `errors`, у каждого элемента которого есть `code`
    (см. `Api.Response.Model.ErrorAttribute`). Значение `code` принимает одну из двух форм:
    - `ErrorCode` — запрос отклонён по существу, ошибка не относится к конкретному полю запроса;
    - `ErrorCode/field_name` — ошибка относится к значению поля запроса. Суффикс после первого `/`
      совпадает с именем поля в JSON, префикс задаёт причину отказа.

    Ошибки проверки схемы (обязательность, длина, формат) приходят с префиксом `ValidateError`,
    то есть как `ValidateError/field_name`, и возможны для любого поля, объявленного в схеме запроса.
    Значения, возможные у конкретного метода, перечислены в его собственном описании.
servers:
  - url: http://api.sample.local/auth
    description: Local Domain
  - url: http://localhost:8080/auth
    description: Local Host
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Auth API
  - name: Auth.Check
    description: Auth API Helps to check user data
  - name: Auth.Operation
    description: Auth API Confirmation operations
  - name: Auth.Security
    description: Auth API User security methods change protected user properties
  - name: Auth.Sessions
    description: Auth API User Sessions
